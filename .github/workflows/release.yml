name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania, np. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build verified package
        shell: powershell
        run: .\scripts\Publish.ps1

      - name: Create SHA-256 file
        shell: powershell
        run: |
          $asset = ".\ServerBackuper-win-x64.zip"
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash
          "$hash  ServerBackuper-win-x64.zip" | Set-Content -LiteralPath "$asset.sha256" -Encoding utf8 -NoNewline

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = ".\ServerBackuper-win-x64.zip"
          $checksum = "$asset.sha256"
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset $checksum --clobber
          }
          else {
            gh release create $env:RELEASE_TAG $asset $checksum --target $env:GITHUB_SHA --title "Server Backuper $env:RELEASE_TAG" --generate-notes
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Server-Backuper-${{ env.RELEASE_TAG }}-win-x64
          path: |
            ServerBackuper-win-x64.zip
            ServerBackuper-win-x64.zip.sha256
          if-no-files-found: error
