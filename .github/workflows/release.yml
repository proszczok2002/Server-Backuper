name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania, np. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build verified package
        shell: powershell
        run: .\scripts\Publish.ps1

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $asset = ".\ServerBackuper-win-x64.zip"
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          }
          else {
            gh release create $env:RELEASE_TAG $asset --target $env:GITHUB_SHA --title "Server Backuper $env:RELEASE_TAG" --generate-notes
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Server-Backuper-${{ inputs.tag }}-win-x64
          path: ServerBackuper-win-x64.zip
          if-no-files-found: error
